# Shared ROS 2 params for both packages:
# --ros-args --params-file config.yaml

/**:
  ros__parameters:
    safe_distance: 1.0      # m
    danger_zone_factor: 1.2 # obj detection processes objects within safe_distance * danger_zone_factor
    fov_deg: 30.0           # front cone half-width
    side_start_deg: 10.0
    side_limit_deg: 45.0

agent:
  ros__parameters:
    safe_distance: 0.5      # m
    half_width: 0.2         # m
    v_max: 0.5              # m/s
    v_slow: 0.2             # m/s
    v_turn: 0.1             # m/s, 0 = turn in place
    omega_max: 0.5          # rad/s

    theta_avoid_deg: 45.0
    theta_tol_deg: 5.0
    e_min: 0.4              # m
    pass_min: 0.5           # m
    clear_ticks: 3
    near_dist: 1.5
    ramp: 1.0

    k_theta: 1.5
    k_e: 1.0

    rate: 10.0              # Hz